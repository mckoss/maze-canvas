<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./styles/maze-canvas.css">

    <title>Maze Generator</title>
</head>

<body>
    <h1>Exhaustive Maze Generator</h1>

    <p>
        This page enables exploring the exhaustive collection of mazes of a given size.
    </p>
    <p>
        Mazes are defined as a rectangular grid of cells, where each cell is
        reachable from any other cell via exactly one path.
    </p>

    <form id="controls" class="controls">
        <label>Rows
            <select id="rows">
                <option>2</option>
                <option selected>3</option>
                <option>4</option>
            </select>
        </label>
        <label>Columns
            <select id="columns">
                <option>2</option>
                <option selected>3</option>
                <option>4</option>
            </select>
        </label>
        <label>Show
            <select id="show">
                <option value="1" selected>All unique</option>
                <option value="2">Symmetric only</option>
                <option value="4">4-way symmetric only</option>
            </select>
        </label>
    </form>

    <div id="stats" aria-live="polite"></div>

    <div id="maze-list" class="maze-list"></div>

    <div id="error"></div>

    <script type="module">
        import { initializePage } from "./scripts/maze-canvas-page.js";
        initializePage();
    </script>
</body>

</html>
